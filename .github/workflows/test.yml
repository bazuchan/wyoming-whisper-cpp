name: Test and Publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: python -m build

  docker:
    name: Build, Test and Publish Vulkan Image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Set image name and publication policy
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          PUBLISH: >-
            ${{ github.event_name != 'pull_request' &&
                (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
                 startsWith(github.ref, 'refs/tags/v')) }}
        run: |
          echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
      - name: Generate image tags and OCI labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=vulkan,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},suffix=-vulkan
            type=sha,prefix=vulkan-sha-
      - name: Build Vulkan image for local checks
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: |
            WHISPER_CPP_VULKAN=ON
            CMAKE_BUILD_PARALLEL_LEVEL=2
          load: true
          push: false
          tags: |
            wyoming-whisper-cpp:test
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=whisper-vulkan-amd64
          cache-to: type=gha,mode=max,scope=whisper-vulkan-amd64
      - name: Check CLI
        run: docker run --rm wyoming-whisper-cpp:test --help
      - name: Check native library linkage without requiring a GPU
        run: >-
          docker run --rm --entrypoint python wyoming-whisper-cpp:test
          -c 'from pywhispercpp.model import Model; print(Model.system_info())'
      - name: Log in to GitHub Container Registry
        if: steps.image.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image
        if: steps.image.outputs.publish == 'true'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
