name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -e '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: pytest
      - run: python -m build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wyoming-whisper-cpp:test .
      - run: docker run --rm wyoming-whisper-cpp:test --help
      - name: Check native library linkage without requiring a GPU
        run: >-
          docker run --rm --entrypoint python wyoming-whisper-cpp:test
          -c 'from pywhispercpp.model import Model; print(Model.system_info())'
